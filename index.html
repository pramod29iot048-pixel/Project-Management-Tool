<!DOCTYPE html>
<html>
<head>
    <title>Project Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Project Management Tool</h1>

<input id="task" placeholder="Enter task">
<button onclick="addTask()">Add Task</button>

<div class="board">

    <div>
        <h2>To Do</h2>
        <div id="todo"></div>
    </div>

    <div>
        <h2>In Progress</h2>
        <div id="progress"></div>
    </div>

    <div>
        <h2>Done</h2>
        <div id="done"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
